name: build

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

env:
  RELEASE_VERSION: 0.2.0-preview.1

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
      - name: Verify release version
        shell: powershell
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
            if ($tagVersion -ne $env:RELEASE_VERSION) {
              throw "Tag version '$tagVersion' does not match release version '$env:RELEASE_VERSION'."
            }
          }
          $source = Get-Content -LiteralPath "$PWD\src\OpenSynapse.PowerShell\OpenSynapse.ps1" -Raw
          if ($source.IndexOf("`$script:AppVersion = '$env:RELEASE_VERSION'", [StringComparison]::Ordinal) -lt 0) {
            throw "Runtime version does not match $env:RELEASE_VERSION."
          }
      - name: Validate PowerShell
        shell: powershell
        run: |
          $scriptRoots = @(
            "$PWD\scripts",
            "$PWD\src\OpenSynapse.PowerShell"
          )
          foreach ($script in Get-ChildItem $scriptRoots -Recurse -File | Where-Object { $_.Extension -in @('.ps1', '.psm1') }) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors) { throw ($errors | Out-String) }
          }
          & "$PWD\scripts\Test-InstallerDefinitions.ps1"
          & "$PWD\scripts\Test-Milestones.ps1"
      - run: dotnet restore OpenSynapse.sln
      - run: dotnet format OpenSynapse.sln --verify-no-changes --no-restore
      - run: dotnet build OpenSynapse.sln --configuration Release --no-restore
      - run: dotnet test OpenSynapse.sln --configuration Release --no-build --no-restore
      - name: Publish OpenSynapse
        shell: powershell
        run: .\scripts\Publish-OpenSynapse.ps1 -Version $env:RELEASE_VERSION
      - name: Install Inno Setup
        shell: powershell
        run: choco install innosetup --no-progress -y
      - name: Build Setup executable
        shell: powershell
        run: .\scripts\Build-Setup.ps1 -Version $env:RELEASE_VERSION
      - name: Hash release packages
        shell: powershell
        run: |
          $packages = @(
            (Join-Path $PWD "artifacts\OpenSynapse-$env:RELEASE_VERSION.zip"),
            (Join-Path $PWD "artifacts\OpenSynapse-Setup-$env:RELEASE_VERSION.exe")
          )
          $checksums = foreach ($package in $packages) {
            if (-not (Test-Path -LiteralPath $package -PathType Leaf)) {
              throw "Release package was not created: $package"
            }
            $hash = (Get-FileHash -LiteralPath $package -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $([IO.Path]::GetFileName($package))"
          }
          $checksums | Set-Content -LiteralPath "$PWD\artifacts\SHA256SUMS.txt" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: OpenSynapse-${{ env.RELEASE_VERSION }}
          if-no-files-found: error
          path: |
            artifacts/OpenSynapse-${{ env.RELEASE_VERSION }}.zip
            artifacts/OpenSynapse-Setup-${{ env.RELEASE_VERSION }}.exe
            artifacts/SHA256SUMS.txt

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: OpenSynapse-${{ env.RELEASE_VERSION }}
          path: artifacts
      - name: Set release title
        id: release
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "title=OpenSynapse ${version/-preview./ Preview }" >> "$GITHUB_OUTPUT"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.release.outputs.title }}
          prerelease: true
          generate_release_notes: true
          files: |
            artifacts/OpenSynapse-${{ env.RELEASE_VERSION }}.zip
            artifacts/OpenSynapse-Setup-${{ env.RELEASE_VERSION }}.exe
            artifacts/SHA256SUMS.txt
